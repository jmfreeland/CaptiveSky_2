; Keep every texture-quality tier aligned with DefaultEngine.ini. Unreal's
; BaseScalability.ini otherwise resets the pool to 1000 MiB with no VRAM clamp
; whenever a texture scalability profile is applied. The VRAM clamp preserves
; the engine's per-device ceiling.
[TextureQuality@0]
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@1]
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@2]
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@3]
r.Streaming.PoolSize=4096
r.Streaming.LimitPoolSizeToVRAM=1
